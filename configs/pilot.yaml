seed: 1234

model:
  resolution: [256, 256]
  patch_size: 16
  hidden_size: 384
  depth: 12
  heads: 8
  mlp_ratio: 4.0

data:
  # Prefer manifests for very large datasets. Each line is either:
  #   /absolute/or/relative/path.jpg
  # or:
  #   stable-image-id<TAB>/absolute/or/relative/path.jpg
  train_manifest: /mnt/IMAGING/HUB/DATASETS/general_datasets/animals/animals.txt
  val_manifest: null
  train_root: null
  val_root: /mnt/IMAGING/HUB/DATASETS/general_datasets/imagenet/custom_val
  resolution: [256, 256]
  batch_size: 8
  val_batch_size: 4
  num_workers: 4
  horizontal_flip: true

training:
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  max_epochs: 100
  max_steps: null
  accumulate_grad_batches: 1
  learning_rate: 0.0002
  weight_decay: 0.0001
  warmup_steps: 1000
  auxiliary_weight: 1.0
  time_sampling:
    # Official pMF 256px B/16 logit-normal preset.
    p_mean: 0.8
    p_std: 0.8
    data_proportion: 0.5
    tr_uniform: false
    uniform_probability: 0.1
  gradient_clip_val: 1.0
  checkpoint_dir: checkpoints
  log_dir: logs
  logger:
    type: mlflow
    tracking_uri: sqlite:///./mlflow.db
    artifact_location: file:./mlartifacts
    experiment_name: tmp
    run_name: color-mf-pilot
    log_model: false
  sample_dir: qualitative
  sync_batchnorm: false

validation:
  image_ids: []
